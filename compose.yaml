# Local development databases for the storage adapters (docs/STORAGE_SPEC.md).
# Not for production: no passwords, no TLS, no persistent volumes, ports bound to
# 127.0.0.1 only. Start with `docker compose up -d --wait`; stop with `docker compose down`.
# Host ports default to 55432 and 57017 to avoid local servers; override with
# LITTLE_HARNESS_POSTGRES_PORT and LITTLE_HARNESS_MONGODB_PORT. With the defaults:
#   LITTLE_HARNESS_TEST_POSTGRES_DSN=postgresql://postgres@127.0.0.1:55432/postgres
#   LITTLE_HARNESS_TEST_MONGODB_URI=mongodb://127.0.0.1:57017/?directConnection=true
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${LITTLE_HARNESS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  mongodb:
    image: mongo:9.0
    # Transactions need a replica set; one member is enough for development.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:${LITTLE_HARNESS_MONGODB_PORT:-57017}:27017"
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: '127.0.0.1:27017'}]}) } quit(db.hello().isWritablePrimary ? 0 : 1)"
      interval: 2s
      timeout: 10s
      retries: 30
